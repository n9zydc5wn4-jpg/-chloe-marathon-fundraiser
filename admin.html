<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chloe's Fundraiser Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#fff0f8,#f3e7ff);
  color: #34223d;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(70,30,90,.12);
  margin-bottom: 20px;
}

h1 {
  color: #8232a7;
  margin-top: 0;
}

h2 {
  color: #8232a7;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin: 7px 0 12px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.login {
  width: 100%;
  background: #e83e8c;
  color: white;
}

.confirm {
  background: #8232a7;
  color: white;
}

.logout {
  background: #888;
  color: white;
  float: right;
}

.number-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.number {
  font-size: 20px;
  font-weight: bold;
  color: #8232a7;
}

.expiry {
  font-size: 12px;
  color: #777;
}

.message {
  margin: 15px 0;
  font-weight: bold;
}

.hidden {
  display: none;
}

.stat {
  background: #faf2ff;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  margin-bottom: 10px;
}

.stat strong {
  display: block;
  font-size: 25px;
  color: #8232a7;
}

</style>

</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginCard" class="card">

<h1>🔐 Chloe's Fundraiser Admin</h1>

<p>
Log in to manage your London Marathon number grid.
</p>

<input
  id="email"
  type="email"
  placeholder="Email address">

<input
  id="password"
  type="password"
  placeholder="Password">

<button
  class="login"
  onclick="login()">
  Log in
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN -->

<div id="adminCard" class="card hidden">

<button
  class="logout"
  onclick="logout()">
  Log out
</button>

<h1>🏃‍♀️ Fundraiser Admin</h1>

<p>
Confirm £10 payments received through Monzo.
</p>

<div class="stat">
<strong id="paid">0</strong>
Paid numbers
</div>

<div class="stat">
<strong id="raised">£0</strong>
Total raised
</div>

<h2>⏳ Numbers currently held</h2>

<div id="heldNumbers">
Loading...
</div>

<div id="adminMessage" class="message"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://ycbysihgabzarycfkiza.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CHRKqJiaJRt2vksdtPgeEA_1HBT1ye5";

let accessToken = null;

const headers = {
  "apikey": SUPABASE_KEY,
  "Content-Type": "application/json"
};


async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  const response = await fetch(
    SUPABASE_URL +
    "/auth/v1/token?grant_type=password",
    {
      method: "POST",
      headers: {
        ...headers,
        "Authorization":
          "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {

    message.textContent =
      data.error_description ||
      "Login failed.";

    return;
  }

  accessToken = data.access_token;

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("adminCard")
    .classList.remove("hidden");

  loadAdmin();

}


async function loadAdmin() {

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/fundraiser_numbers" +
    "?select=number,status,reserved_at,expires_at" +
    "&order=number.asc",
    {
      headers: {
        ...headers,
        "Authorization":
          "Bearer " + accessToken
      }
    }
  );

  if (!response.ok) {

    document.getElementById("adminMessage").textContent =
      "Unable to load fundraiser numbers.";

    return;
  }

  const numbers =
    await response.json();

  const held =
    numbers.filter(n => n.status === "reserved");

  const paid =
    numbers.filter(n => n.status === "taken");

  document.getElementById("paid").textContent =
    paid.length;

  document.getElementById("raised").textContent =
    "£" + (paid.length * 10);

  const container =
    document.getElementById("heldNumbers");

  container.innerHTML = "";

  if (held.length === 0) {

    container.innerHTML =
      "<p>No numbers currently held.</p>";

    return;
  }

  held.forEach(item => {

    const row =
      document.createElement("div");

    row.className =
      "number-row";

    const expiry =
      item.expires_at
        ? new Date(item.expires_at)
            .toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit"
            })
        : "";

    row.innerHTML = `

      <div>

        <div class="number">
          Number ${item.number}
        </div>

        <div class="expiry">
          Held until ${expiry}
        </div>

      </div>

      <button
        class="confirm"
        onclick="confirmPayment(${item.number})">

        ✓ Confirm £10

      </button>

    `;

    container.appendChild(row);

  });

}


async function confirmPayment(number) {

  const message =
    document.getElementById("adminMessage");

  const confirmed =
    confirm(
      "Have you received the £10 payment for number " +
      number +
      "?"
    );

  if (!confirmed) return;

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/rpc/confirm_payment",
    {
      method: "POST",

      headers: {
        ...headers,
        "Authorization":
          "Bearer " + accessToken
      },

      body: JSON.stringify({
        p_number: number
      })
    }
  );

  const result =
    await response.json();

  if (result === true) {

    message.textContent =
      "Number " + number +
      " is now confirmed as PAID.";

    loadAdmin();

  } else {

    message.textContent =
      "Could not confirm number " +
      number +
      ". It may have expired.";

    loadAdmin();

  }

}


function logout() {

  accessToken = null;

  document
    .getElementById("adminCard")
    .classList.add("hidden");

  document
    .getElementById("loginCard")
    .classList.remove("hidden");

}

</script>

</body>
</html>
