<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chloe's Fundraiser Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#fff0f8,#f3e7ff);
  color: #34223d;
}

.container {
  max-width: 750px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(70,30,90,.12);
}

h1, h2 {
  color: #8232a7;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin: 6px 0 12px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.login {
  width: 100%;
  background: #e83e8c;
  color: white;
}

.confirm {
  background: #8232a7;
  color: white;
}

.logout {
  background: #888;
  color: white;
  float: right;
}

.number-row {
  padding: 15px 0;
  border-bottom: 1px solid #eee;
}

.number {
  font-size: 20px;
  font-weight: bold;
  color: #8232a7;
}

.details {
  margin: 5px 0;
  line-height: 1.5;
}

.expiry {
  font-size: 12px;
  color: #777;
}

.status {
  font-weight: bold;
  margin-top: 5px;
}

.message {
  margin: 15px 0;
  font-weight: bold;
}

.hidden {
  display: none;
}

.stat {
  background: #faf2ff;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  margin-bottom: 10px;
}

.stat strong {
  display: block;
  font-size: 25px;
  color: #8232a7;
}

.paid-row {
  background: #f8f8f8;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 8px;
}

</style>

</head>

<body>

<div class="container">


<!-- LOGIN -->

<div id="loginCard" class="card">

<h1>🔐 Chloe's Fundraiser Admin</h1>

<p>
Log in to manage your London Marathon fundraiser.
</p>

<input
id="email"
type="email"
placeholder="Email address">

<input
id="password"
type="password"
placeholder="Password">

<button
class="login"
onclick="login()">

Log in

</button>

<div
id="loginMessage"
class="message">
</div>

</div>


<!-- ADMIN -->

<div id="adminCard" class="hidden">


<div class="card">

<button
class="logout"
onclick="logout()">

Log out

</button>

<h1>🏃‍♀️ Fundraiser Admin</h1>

<div class="stat">

<strong id="paid">
0
</strong>

Paid numbers

</div>


<div class="stat">

<strong id="raised">
£0
</strong>

Total raised

</div>

</div>


<!-- HELD -->

<div class="card">

<h2>
⏳ Currently Held
</h2>

<p>
These people have selected a number and have 15 minutes to pay.
</p>

<div id="heldNumbers">
Loading...
</div>

</div>


<!-- PAID -->

<div class="card">

<h2>
✅ Paid Numbers
</h2>

<div id="paidNumbers">
Loading...
</div>

</div>


<div
id="adminMessage"
class="message">
</div>


</div>

</div>


<script>


const SUPABASE_URL =
"https://ycbysihgabzarycfkiza.supabase.co";


const SUPABASE_KEY =
"sb_publishable_CHRKqJiaJRt2vksdtPgeEA_1HBT1ye5";


let accessToken = null;


const headers = {

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

};



async function login() {


const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;


const message =
document.getElementById("loginMessage");


message.textContent =
"Logging in...";


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method: "POST",

headers: {

...headers,

"Authorization":
"Bearer " + SUPABASE_KEY

},

body: JSON.stringify({

email: email,

password: password

})

}

);


const data =
await response.json();


if (!response.ok) {

message.textContent =
data.error_description ||
"Login failed.";

return;

}


accessToken =
data.access_token;


document
.getElementById("loginCard")
.classList.add("hidden");


document
.getElementById("adminCard")
.classList.remove("hidden");


loadAdmin();

}



async function loadAdmin() {


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/fundraiser_numbers" +
"?select=number,status,buyer_name,buyer_mobile,reserved_at,expires_at" +
"&order=number.asc",

{

headers: {

...headers,

"Authorization":
"Bearer " + accessToken

}

}

);


if (!response.ok) {

document.getElementById("adminMessage").textContent =
"Unable to load fundraiser numbers.";

return;

}


const numbers =
await response.json();


const held =
numbers.filter(
n => n.status === "reserved"
);


const paid =
numbers.filter(
n => n.status === "taken"
);


document.getElementById("paid").textContent =
paid.length;


document.getElementById("raised").textContent =
"£" + (paid.length * 10);



/* HELD NUMBERS */

const heldContainer =
document.getElementById("heldNumbers");


heldContainer.innerHTML = "";


if (held.length === 0) {

heldContainer.innerHTML =
"<p>No numbers currently held.</p>";

}

else {


held.forEach(item => {


const row =
document.createElement("div");


row.className =
"number-row";


let expiry = "";


if (item.expires_at) {

expiry =
new Date(item.expires_at)
.toLocaleTimeString([], {

hour: "2-digit",

minute: "2-digit"

});

}


row.innerHTML = `

<div class="number">
Number ${item.number}
</div>

<div class="details">

👤 <strong>
${escapeHtml(item.buyer_name || "")}
</strong>

<br>

📱 ${escapeHtml(item.buyer_mobile || "")}

</div>

<div class="expiry">

Held until ${expiry}

</div>

<br>

<button
class="confirm"
onclick="confirmPayment(${item.number})">

✓ Confirm £10 Payment

</button>

`;


heldContainer.appendChild(row);

});

}



/* PAID NUMBERS */

const paidContainer =
document.getElementById("paidNumbers");


paidContainer.innerHTML = "";


if (paid.length === 0) {

paidContainer.innerHTML =
"<p>No paid numbers yet.</p>";

}

else {


paid.forEach(item => {


const row =
document.createElement("div");


row.className =
"paid-row";


row.innerHTML = `

<strong>
Number ${item.number}
</strong>

<br>

👤 ${escapeHtml(item.buyer_name || "")}

<br>

📱 ${escapeHtml(item.buyer_mobile || "")}

`;


paidContainer.appendChild(row);

});

}

}



async function confirmPayment(number) {


const confirmed =
confirm(

"Have you received the £10 payment for number " +
number +
"?"

);


if (!confirmed) return;


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/rpc/confirm_payment",

{

method: "POST",

headers: {

...headers,

"Authorization":
"Bearer " + accessToken

},

body: JSON.stringify({

p_number: number

})

}

);


const result =
await response.json();


const message =
document.getElementById("adminMessage");


if (result === true) {

message.textContent =
"Number " +
number +
" is now confirmed as PAID.";

loadAdmin();

}

else {

message.textContent =
"Could not confirm payment. The reservation may have expired.";

loadAdmin();

}

}



function escapeHtml(value) {

return String(value)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}



function logout() {

accessToken = null;


document
.getElementById("adminCard")
.classList.add("hidden");


document
.getElementById("loginCard")
.classList.remove("hidden");

}


</script>

</body>

</html>
